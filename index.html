<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de senha</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="unlock.svg" alt="cadeado fechado">
            <h2 class="titulo-principal">Gerador de senha</h2>
            <h3 class="titulo-secundario">Gere instantaneamente uma senha aleatoria e segura</h3>
        </div>
        <div class="conteudo-senha">
         <label for="senha">Senha</label>
         <input name="senha" type="text" id="campo-senha" readonly>
        </div>
        <div class="parametro">
            <h3 class="parametro-titulo">personalize sua senha</h3>
        </div class="parametro-coluna__senha">
    </div class="parametro-senha">
    <h4 class="parametro-senha_titulo">Numero de caracteres</h4>
    <div class="parametro-senha-botoes">
    <button class="parametro-senha__botao">.</button>
       <p class="parametro-senha__texto">12</p>
       <button class="parametro-senha__botao">+</button>
        </div>
      </div>
      <div class="parametro-senha">
        <h4 class="parametro-senha_titulo">características de senha</h4>
        <div class="parametro-senha-checkbox">
            <input name="maiusculo" type="checkbox" class="checkbox" checked>
            <label for="maiusculo">Letras maiúsculas</label>
        </div>
        <div class="parametro-senha-checkbox">
            <input name="minusculo" type="checkbox" class="checkbox" checked>
            <label for="minusculo">Letras minusculas</label>
        </div>
           <div class="parametro-senha-checkbox">
            <input name="numero" type="checkbox" class="checkbox" checked>
            <label for="numero">Número</label>
        </div>
           <div class="parametro-senha-checkbox">
            <input name="simbolo" type="checkbox" class="checkbox" checked>
            <label for="simbolo">Símbolos</label>
        </div>
</div>
<div class="parametro-senha">
    <h4 class="parametro-senha__titulo">força da senha</h4>
    <div class="barra"></div>
    <div class="forca fraca"></div>
    <div class="parametro-senha-textos">
        <p>Fraca</p>
        <p>MÉdia</p>
        <P>Forte</P>
    </div>
</div>
</div>
</div>
</section>
<script src="main.js"></script>
</body>

</html>
